name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: flxk1/loomground-ref
          path: _siblings/loomground-ref
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: flxk1/skill-governance-block
          path: _siblings/skill-governance-block
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Run the suite with the reference evaluator and the block spec checkout
        env:
          GOVERNANCE_LAYER_LOOMGROUND_REF: _siblings/loomground-ref
          GOVERNANCE_LAYER_SGB_PATH: _siblings/skill-governance-block
        run: python -m pytest -q
